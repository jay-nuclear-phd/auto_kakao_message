<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a78d6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E3%3C/text%3E%3C/svg%3E">
<title>3반 결강 현황</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f4f6;
  --card: #ffffff;
  --surface-1: #fcfcfb;
  --line: #e3e3df;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --accent: #2a78d6;
  --accent-ink: #ffffff;
  --accent-soft: #e6f0fc;
  --danger: #d03b3b;
  --good: #0ca30c;
  /* 결강 시간 구간 (ordinal, 검증 완료) */
  --b0: #86b6ef; --b1: #5598e7; --b2: #2a78d6; --b3: #1c5cab; --b4: #0d366b;
  --b0-ink: #0b0b0b; --b1-ink: #0b0b0b; --b2-ink: #ffffff; --b3-ink: #ffffff; --b4-ink: #ffffff;
  --track: #ecebe7;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111110;
    --card: #1a1a19;
    --surface-1: #1a1a19;
    --line: #33332f;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --accent: #3987e5;
    --accent-ink: #ffffff;
    --accent-soft: #1d2b3d;
    --danger: #e05656;
    --b0: #184f95; --b1: #256abf; --b2: #3987e5; --b3: #6da7ec; --b4: #b7d3f6;
    --b0-ink: #ffffff; --b1-ink: #ffffff; --b2-ink: #ffffff; --b3-ink: #0b0b0b; --b4-ink: #0b0b0b;
    --track: #2a2a27;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 16px; line-height: 1.45;
  padding: 0 0 calc(24px + env(safe-area-inset-bottom));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg); padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.top h1 { font-size: 18px; margin: 0; }
.badges { display: flex; gap: 6px; }
.badge { font-size: 12px; color: var(--text-secondary); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
button.badge { color: var(--accent); font-weight: 600; }
main { max-width: 560px; margin: 0 auto; padding: 0 12px; display: grid; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.card h2 { font-size: 16px; margin: 0 0 12px; }
fieldset.plain { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.plain:disabled { opacity: .45; }
.field { display: grid; gap: 6px; margin-top: 16px; }
.field > .label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
input[type=text], input[type=password], input[type=number], select {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-1); font-size: 16px;
}
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; gap: 8px; align-items: stretch; }
.row > select, .row > input { flex: 1; min-width: 0; }

.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.navbtn { width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-1); font-size: 24px; line-height: 1; flex: none; }
.datelabel { text-align: center; flex: 1; }
.datelabel .main { font-size: 20px; font-weight: 700; }
.datelabel .sub { font-size: 13px; color: var(--text-secondary); }
.datelabel .sub button { border: 0; background: none; color: var(--accent); padding: 0 0 0 4px; font-size: 13px; text-decoration: underline; }

.lockbox { margin-top: 16px; padding: 12px; border-radius: 12px; background: var(--accent-soft); display: grid; gap: 8px; }
.lockbox p { margin: 0; font-size: 14px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--track); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; font-weight: 600; color: var(--text-secondary); }
.seg button[aria-pressed=true] { background: var(--card); color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.seg.small button { min-height: 36px; font-size: 14px; }

.ghost { min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-1); font-weight: 600; white-space: nowrap; }
.primary { width: 100%; min-height: 52px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 700; }
.primary:disabled, .ghost:disabled { opacity: .45; }
.danger { color: var(--danger); }
.actions { display: grid; gap: 8px; margin-top: 20px; }
.hint { font-size: 13px; color: var(--text-secondary); }
.subform { display: grid; gap: 8px; margin-top: 8px; padding: 12px; border-radius: 12px; background: var(--accent-soft); }

.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-1); font-size: 14px; font-variant-numeric: tabular-nums; }
.presets button.clear { color: var(--text-secondary); }
.blocks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
.blk { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-1); font-size: 14px; font-variant-numeric: tabular-nums; padding: 0; }
.blk.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.timetext { font-size: 15px; font-weight: 700; }

.toast { min-height: 20px; font-size: 14px; font-weight: 600; color: var(--good); text-align: center; }
.toast.err { color: var(--danger); }

pre.msg {
  white-space: pre-wrap; word-break: keep-all; margin: 12px 0; padding: 14px; border-radius: 12px;
  background: var(--surface-1); border: 1px solid var(--line); font-family: inherit; font-size: 15px; line-height: 1.55;
}
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--surface-1); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 12px; color: var(--text-secondary); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; font-size: inherit; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 12px 0 4px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.empty { padding: 24px 0; text-align: center; color: var(--text-muted); font-size: 14px; }

/* 일간 타임라인 */
.tl { display: grid; gap: 10px; margin-top: 12px; }
.tlrow { display: grid; grid-template-columns: 76px 1fr 40px; gap: 8px; align-items: center; }
.tlname { font-size: 13px; line-height: 1.25; overflow: hidden; }
.tlname small { display: block; color: var(--text-secondary); font-size: 11px; }
.tltrack { position: relative; height: 24px; background: var(--track); border-radius: 6px; }
.tlseg { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.tlh { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.tlaxis { display: grid; grid-template-columns: 76px 1fr 40px; gap: 8px; font-size: 11px; color: var(--text-muted); }
.tlaxis .ticks { position: relative; height: 14px; }
.tlaxis .ticks span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }

/* 주간 히트맵 */
.hmwrap { overflow-x: auto; margin-top: 12px; -webkit-overflow-scrolling: touch; }
table.hm { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
table.hm th { font-weight: 600; color: var(--text-secondary); padding: 2px; }
table.hm th.nm, table.hm td.nm { position: sticky; left: 0; background: var(--card); text-align: left; white-space: nowrap; padding-right: 6px; z-index: 1; font-weight: 500; color: var(--text-primary); }
table.hm td.c { min-width: 40px; height: 32px; text-align: center; border-radius: 4px; background: var(--track); padding: 0; }
table.hm th.nm, table.hm td.nm, table.hm td.tot { width: 1%; }
table.hm td.tot { padding: 0 4px 0 6px; text-align: right; font-weight: 700; white-space: nowrap; }
table.hm td.c[data-tip] { cursor: pointer; }

/* 월간 달력 */
.cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 12px; }
.cal .dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-secondary); padding-bottom: 2px; }
.cal .day { min-height: 88px; border: 1px solid var(--line); border-radius: 8px; padding: 4px; background: var(--surface-1); display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
.cal .day.out { visibility: hidden; }
.cal .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .dn { font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; }
.cal .dn .cnt { font-weight: 600; color: var(--text-secondary); font-size: 11px; }
.cal .chip { font-size: 10px; line-height: 1.35; border-radius: 4px; padding: 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .more { font-size: 10px; color: var(--text-secondary); }

.tip { position: fixed; z-index: 20; max-width: 260px; background: var(--text-primary); color: var(--card); font-size: 13px; padding: 8px 10px; border-radius: 8px; pointer-events: none; box-shadow: 0 4px 16px rgba(0,0,0,.25); white-space: pre-line; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <h1>26-3기 3반 결강 현황</h1>
  <div class="badges">
    <button type="button" class="badge" id="adminBadge" hidden>관리자 · 로그아웃</button>
    <span class="badge" id="modeBadge"></span>
  </div>
</header>

<main>
  <!-- 1. 입력 -->
  <section class="card" id="inputCard" aria-label="결강 입력">
    <div class="datenav">
      <button class="navbtn" id="prevDay" aria-label="이전 날짜">‹</button>
      <div class="datelabel">
        <div class="main" id="dateMain"></div>
        <div class="sub" id="dateSub"></div>
      </div>
      <button class="navbtn" id="nextDay" aria-label="다음 날짜">›</button>
    </div>

    <div class="lockbox" id="lockBox" hidden>
      <p>🔒 지금 조사 중인 날짜가 아니에요. 다른 날짜를 입력하거나 수정하려면 관리자 로그인이 필요해요.</p>
      <form id="loginForm" class="row" style="flex-wrap:wrap" autocomplete="on">
        <input type="text" id="adminId" placeholder="아이디" autocomplete="username" autocapitalize="off" style="flex:1 1 120px">
        <input type="password" id="adminPw" placeholder="비밀번호" autocomplete="current-password" style="flex:1 1 120px">
        <button type="submit" class="ghost" id="loginBtn" style="flex:1 1 100%">관리자 로그인</button>
      </form>
    </div>

    <fieldset class="plain" id="formFields">
      <label class="field">
        <span class="label">이름</span>
        <input type="text" id="name" placeholder="예: 소령 홍길동" list="nameList" autocomplete="off" enterkeyhint="done">
      </label>
      <datalist id="nameList"></datalist>

      <div id="absentFields">
        <div class="field">
          <span class="label">사유</span>
          <div class="row">
            <select id="reason" aria-label="결강 사유"></select>
            <button type="button" class="ghost" id="addReasonBtn">+ 추가</button>
          </div>
          <div class="subform" id="addReasonForm" hidden>
            <input type="text" id="newReason" placeholder="새 사유 (예: 병가)">
            <div class="seg small" id="reasonTypeSeg">
              <button type="button" data-rtype="leave" aria-pressed="true">휴가 (출근에서 제외)</button>
              <button type="button" data-rtype="time" aria-pressed="false">시간 사용 (출근 유지)</button>
            </div>
            <div class="row">
              <button type="button" class="ghost" id="cancelReason" style="flex:1">취소</button>
              <button type="button" class="ghost" id="saveReason" style="flex:1;color:var(--accent)">추가하기</button>
            </div>
          </div>
        </div>

        <div class="field">
          <span class="label">결강 시간 <span class="hint" style="font-weight:400">— 쓰는 30분 칸을 눌러 선택 (다시 누르면 해제)</span></span>
          <div class="presets" id="presets"></div>
          <div class="blocks" id="blocks"></div>
          <div class="timetext" id="timeText"></div>
        </div>
      </div>
    </fieldset>

    <div class="field"><div class="hint" id="formState"></div></div>
    <div class="actions">
      <button type="button" class="primary" id="saveBtn">저장</button>
      <button type="button" class="ghost danger" id="deleteBtn" hidden>이 날짜 내 입력 삭제</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </section>

  <!-- 2. 보고 문구 -->
  <section class="card" id="copyCard" aria-label="카톡 보고 문구">
    <h2>카톡 보고 문구 <span class="hint" id="copyDate" style="font-weight:400"></span></h2>
    <div class="seg small" id="kindSeg">
      <button type="button" data-kind="draft" aria-pressed="false">초안 (전날 16시)</button>
      <button type="button" data-kind="final" aria-pressed="false">최종 (당일 07시)</button>
    </div>
    <div class="stats" id="stats"></div>
    <pre class="msg" id="msg"></pre>
    <button type="button" class="primary" id="copyBtn">복사하기</button>
    <div class="toast" id="copyToast" role="status" aria-live="polite"></div>
    <div class="hint">총원 <span id="totalText"></span>
      <button type="button" class="linkbtn" id="totalBtn" hidden>수정</button>
      <span id="totalEdit" hidden> <input type="number" id="totalInput" min="1" max="200" style="width:90px;min-height:36px;display:inline-block"> <button type="button" class="linkbtn" id="totalSave">저장</button></span>
    </div>
  </section>

  <!-- 3. 대시보드 -->
  <section class="card" id="dashCard" aria-label="대시보드">
    <h2>대시보드</h2>
    <div class="seg" id="viewSeg">
      <button type="button" data-view="day" aria-pressed="true">일</button>
      <button type="button" data-view="week" aria-pressed="false">주</button>
      <button type="button" data-view="month" aria-pressed="false">월</button>
    </div>
    <div class="datenav" style="margin-top:12px">
      <button class="navbtn" id="prevPeriod" aria-label="이전 기간">‹</button>
      <div class="datelabel"><div class="main" id="periodText" style="font-size:17px"></div></div>
      <button class="navbtn" id="nextPeriod" aria-label="다음 기간">›</button>
    </div>
    <div class="legend" id="legend"></div>
    <div id="dashBody"></div>
    <div id="demoTools" hidden style="margin-top:16px">
      <button type="button" class="ghost" id="seedBtn" style="width:100%">미리보기용 샘플 데이터 넣기</button>
    </div>
  </section>
</main>
<div class="tip" id="tip" hidden></div>

<script>
/* ================= 설정 ================= */
const CONFIG = {
  // Google Apps Script 웹앱 배포 URL. 비워두면 이 기기에만 저장되는 미리보기 모드.
  API_URL: 'https://script.google.com/macros/s/AKfycbyKcIBPmcF_OE_hZ73SgueJFD8OhJQbQwUKRLHX4FDdvIIRkSdg8QjR5ltBa6ILh6Fn/exec',
  SITE_URL: 'https://jay-nuclear-phd.github.io/auto_kakao_message/',
  UNIT: '3반',
  DEFAULT_TOTAL: 45,
};
const DEFAULT_REASONS = [
  { name: '육아시간', type: 'time' },
  { name: '청원휴가', type: 'leave' },
  { name: '자녀돌봄', type: 'time' },
];
// 초안 문구에는 0명이어도 나오는 항목. 그 밖의 항목은 1명 이상일 때만 나온다.
const DRAFT_ALWAYS = ['육아시간'];
// 시간 사용 항목의 문구 순서 (나머지는 이름순)
const ITEM_ORDER = ['육아시간', '모성보호시간', '자녀돌봄'];
const DAY_START = 8 * 60, DAY_END = 17 * 60 + 30, SLOT = 30;
const NSLOTS = (DAY_END - DAY_START) / SLOT; // 19칸: 08:00 ~ 17:00 시작
const RANKS = '소위|중위|대위|소령|중령|대령|준장|준위|원사|상사|중사|하사|군무원';
const BINS = [
  { max: 1, label: '1시간 이하' },
  { max: 2, label: '1~2시간' },
  { max: 4, label: '2~4시간' },
  { max: 7.99, label: '4~8시간' },
  { max: Infinity, label: '8시간 이상' },
];

/* ================= 유틸 ================= */
const $ = (id) => document.getElementById(id);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const isWeekend = (s) => { const w = parseYmd(s).getDay(); return w === 0 || w === 6; };
const nextWeekday = (s, dir) => { let t = addDays(s, dir); while (isWeekend(t)) t = addDays(t, dir); return t; };
const shortDate = (s) => { const d = parseYmd(s); return `${d.getMonth() + 1}.${d.getDate()}.(${WD[d.getDay()]})`; };
const reportDate = (s) => { const d = parseYmd(s); return `'${String(d.getFullYear()).slice(2)}.${d.getMonth() + 1}.${d.getDate()}.(${WD[d.getDay()]})`; };
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const slotStart = (i) => DAY_START + i * SLOT;
const fmtH = (h) => (Math.round(h * 10) / 10).toString();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const binOf = (h) => h <= 0 ? -1 : BINS.findIndex((b) => h <= b.max);
const todayStr = () => ymd(new Date());
const shortName = (n) => n.replace(new RegExp(`^(${RANKS})\\s`), '');

// 시간 표현: "08:00~08:30,15:30~17:30"
const normTime = (t) => { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); return m ? `${pad(Number(m[1]))}:${m[2]}` : ''; };
function parseRanges(times) {
  return String(times || '').split(',').map((r) => r.split('~').map(normTime)).filter(([a, b]) => a && b && a < b);
}
const normTimes = (times) => parseRanges(times).map(([a, b]) => `${a}~${b}`).join(',');
const dispTimes = (times) => parseRanges(times).map(([a, b]) => `${a}~${b}`).join(', ');
// 점심시간(12:00~13:00)은 결강 시간에서 뺀다 → 08:30~17:30 은 8시간
const LUNCH = [12 * 60, 13 * 60];
const WORK = [8 * 60 + 30, 17 * 60 + 30];
const overlap = (a, b, [c, d]) => Math.max(0, Math.min(b, d) - Math.max(a, c));
const minsOf = (e, within) => parseRanges(e.times).reduce((m, [a, b]) => {
  let s = toMin(a), t = toMin(b);
  if (within) { s = Math.max(s, within[0]); t = Math.min(t, within[1]); if (t <= s) return m; }
  return m + (t - s) - overlap(s, t, LUNCH);

const hoursOf = (e) => e.status === 'absent' ? minsOf(e) / 60 : 0;
// 08:30~17:30 (점심 제외 8시간) 을 모두 덮어야 하루 전체
const isFullDay = (e) => minsOf(e, WORK) >= WORK[1] - WORK[0] - (LUNCH[1] - LUNCH[0]);
function slotsToTimes(slots) {
  const idx = [...slots].sort((a, b) => a - b);
  const out = [];
  for (const i of idx) {
    const last = out[out.length - 1];
    if (last && last[1] === i - 1) last[1] = i; else out.push([i, i]);

}
function timesToSlots(times) {
  const set = new Set();
  for (const [a, b] of parseRanges(times)) {
    for (let m = toMin(a); m < toMin(b); m += SLOT) {
      const i = (m - DAY_START) / SLOT;
      if (Number.isInteger(i) && i >= 0 && i < NSLOTS) set.add(i);
    }
  }
  return set;
}

function normName(raw) {
  let s = (raw || '').trim().replace(/\s+/g, ' ');
  if (!s) return '';
  const m = s.match(new RegExp(`^(${RANKS})\\s*(.+)$`));
  if (m) return `${m[1]} ${m[2]}`;

}
// 정오 이전이면 오늘, 정오 이후면 다음 날. 주말이면 다음 평일.
function defaultTarget(now = new Date()) {

}
const store = {
  get(k, def, ss) { try { const v = (ss ? sessionStorage : localStorage).getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v, ss) { try { (ss ? sessionStorage : localStorage).setItem(k, JSON.stringify(v)); } catch {} },
  del(k, ss) { try { (ss ? sessionStorage : localStorage).removeItem(k); } catch {} },
};

/* ================= 데이터 계층 ================= */
function localApi() {
  const KEY = 'kd_demo_db';
  const load = () => store.get(KEY, { entries: [], reasons: [], total: CONFIG.DEFAULT_TOTAL });
  const save = (db) => store.set(KEY, db);
  return {
    demo: true,
    async list(from, to) {
      const db = load();
      return { entries: db.entries.filter((e) => e.date >= from && e.date <= to), config: { reasons: db.reasons, total: db.total } };
    },
    async login() { return true; },
    async upsert(entry) {
      const db = load();
      db.entries = db.entries.filter((e) => !(e.date === entry.date && e.name === entry.name));
      db.entries.push(entry); save(db);
    },
    async remove(date, name) {
      const db = load(); db.entries = db.entries.filter((e) => !(e.date === date && e.name === name)); save(db);
    },
    async addReason(r) { const db = load(); if (!db.reasons.some((x) => x.name === r.name)) db.reasons.push(r); save(db); },
    async setTotal(n) { const db = load(); db.total = n; save(db); },
  };
}
function remoteApi(url) {
  async function post(payload) {
    // text/plain 으로 보내야 Apps Script에서 CORS preflight 없이 동작
    const r = await fetch(url, { method: 'POST', body: JSON.stringify({ ...payload, auth: S.admin || undefined }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '저장 실패');
    return j;
  }
  return {
    demo: false,
    async list(from, to) {
      const r = await fetch(`${url}?action=list&from=${from}&to=${to}`);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '불러오기 실패');
      return j;
    },
    async login(id, pw) {
      const r = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'login', auth: { id, pw } }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || '로그인 실패');
      return true;
    },
    upsert: (entry) => post({ action: 'upsert', entry }),
    remove: (date, name) => post({ action: 'remove', date, name }),
    addReason: (reason) => post({ action: 'addReason', reason }),
    setTotal: (total) => post({ action: 'setTotal', total }),
  };
}

const monthKey = (s) => s.slice(0, 7);
function monthRange(key) {
  const [y, m] = key.split('-').map(Number);
  return [`${key}-01`, ymd(new Date(y, m, 0))];
}
function normEntry(e) {
  // 예전 형식(start/end)도 읽을 수 있게
  const times = e.times || (e.start && e.end ? `${e.start}~${e.end}` : '');
  return { date: String(e.date).slice(0, 10), name: String(e.name), status: e.status, reason: e.reason || '', times: normTimes(times), updatedAt: e.updatedAt };
}
async function ensureMonths(keys, force = false) {
  const need = [...new Set(keys)].filter((k) => force || !S.months[k]);
  await Promise.all(need.map(async (k) => {
    const [from, to] = monthRange(k);
    const res = await api.list(from, to);
    S.months[k] = (res.entries || []).map(normEntry);
    if (res.config) {
      const extra = (res.config.reasons || []).filter((r) => !DEFAULT_REASONS.some((d) => d.name === r.name));
      S.reasons = DEFAULT_REASONS.concat(extra);

}
const entriesOn = (date) => (S.months[monthKey(date)] || []).filter((e) => e.date === date);
function entriesBetween(from, to) {
  const out = [];
  for (const k of Object.keys(S.months)) for (const e of S.months[k]) if (e.date >= from && e.date <= to) out.push(e);
  return out;
}

async function save() {
  if (isLocked()) { toast('toast', '관리자 로그인이 필요해요', true); return; }
  const name = normName($('name').value);
  if (!name) { toast('toast', '이름을 입력하세요', true); $('name').focus(); return; }
  $('name').value = name;
  if (!S.form.slots.size) { toast('toast', '결강 시간을 선택하세요', true); return; }
  const entry = { date: S.target, name, status: 'absent', reason: S.form.reason, times: slotsToTimes(S.form.slots), updatedAt: new Date().toISOString() };
  $('saveBtn').disabled = true;
  try {
    await api.upsert(entry);
    const k = monthKey(entry.date);
    S.months[k] = (S.months[k] || []).filter((e) => !(e.date === entry.date && e.name === name)).concat(entry);

const LETTERS = '가나다라마바사아자차카타파하';
const firstStart = (e) => (parseRanges(e.times)[0] || [''])[0];
const byTimeName = (a, b) => firstStart(a).localeCompare(firstStart(b)) || a.name.localeCompare(b.name, 'ko');
function buildMessage(date, kind) {
  const absent = entriesOn(date).filter((e) => e.status === 'absent');
  const leaveN = absent.filter(isLeave).length;  // 출근에서 빼는 사람은 종일 휴가자만
  const groups = new Map((kind === 'draft' ? DRAFT_ALWAYS : []).map((n) => [n, []]));
  absent.forEach((e) => {
    if (!groups.has(e.reason)) groups.set(e.reason, []);
    groups.get(e.reason).push(e);
  });
  // 휴가 유형(반일 포함)을 먼저, 그다음 시간 사용 항목
  const rank = (n) => { const i = ITEM_ORDER.indexOf(n); return (reasonType(n) === 'leave' ? 0 : 100) + (i < 0 ? 99 : i); };
  const ordered = [...groups].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0], 'ko'));

  const total = S.total;
  const items = [];
  items.push(`출근현황 : 총원 ${total}명, ${leaveN ? `휴가 ${leaveN}명, ` : ''}출근 ${total - leaveN}명`);
  for (const [r, list] of ordered) {
    list.sort(byTimeName);
    items.push([`${r} : ${list.length}명`, ...list.map((e) => ` * ${e.name}(${dispTimes(e.times)})`)].join('\n'));
  }
  items.push('건강상태 : 이상무');
  const body = `${reportDate(date)}  <${CONFIG.UNIT}>\n` + items.map((t, i) => `${LETTERS[i]}. ${t}`).join('\n');
  const link = `\n\n결강 입력: ${CONFIG.SITE_URL}`;
  if (kind === 'draft') return `저는 김주연 소령(봇) 입니다. 이 메세지는 매일 16시에 발송됩니다.\n내일 출근현황 종합하겠습니다!\n\n${body}\n\n의견부탁드립니다!${link}`;
  return `${body}\n\n이상없으면 위에 현황으로 보고하겠습니다!${link}`;
}

/* ================= 대시보드 ================= */
function weekStart(s) { const d = parseYmd(s); const w = d.getDay(); d.setDate(d.getDate() - ((w + 6) % 7)); return ymd(d); }

  if (S.view === 'week') { const m = weekStart(S.anchor); return [0, 1, 2, 3, 4].map((i) => addDays(m, i)); }
  const [from, to] = monthRange(monthKey(S.anchor));
  const out = []; for (let t = from; t <= to; t = addDays(t, 1)) if (!isWeekend(t)) out.push(t);

}

function tipFor(e) {

function renderDash() {

  if (S.view === 'month') { renderMonth(body, entries); return; }
  if (!entries.length) { body.innerHTML = `<div class="empty">이 기간에는 결강이 없어요</div>`; return; }

  if (S.view === 'day') {
    entries.sort(byTimeName);
    const total = entries.reduce((a, e) => a + hoursOf(e), 0);
    const span = DAY_END - DAY_START;

    body.innerHTML = `
      <div class="stats" style="margin-top:12px">

      </div>

        ${entries.map((e) => {
          const h = hoursOf(e), b = binOf(h);
          const segs = parseRanges(e.times).map(([a, z]) => {
            const left = ((toMin(a) - DAY_START) / span) * 100;
            const width = ((toMin(z) - toMin(a)) / span) * 100;

          }).join('');

  // 주: 사람 × 요일 히트맵
  const people = new Map();

    const p = people.get(e.name);
    p.byDate[e.date] = e; p.total += hoursOf(e);
  }
  const rows = [...people.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, 'ko'));
  const head = days.map((d) => { const dt = parseYmd(d); return `<th>${WD[dt.getDay()]}<br>${dt.getMonth() + 1}.${dt.getDate()}</th>`; }).join('');
  const sum = rows.reduce((a, p) => a + p.total, 0);
  body.innerHTML = `
    <div class="hint" style="margin-top:12px">결강 ${rows.length}명 · 총 ${fmtH(sum)}시간</div>
    <div class="hmwrap"><table class="hm">
      <thead><tr><th class="nm">이름</th>${head}<th>합계</th></tr></thead>
      <tbody>${rows.map((p) => `<tr>
        <td class="nm">${esc(shortName(p.name))}</td>
        ${days.map((d) => {
          const e = p.byDate[d];
          if (!e) return '<td class="c"></td>';
          const h = hoursOf(e), b = binOf(h);
          return `<td class="c" data-tip="${esc(tipFor(e))}" style="background:var(--b${b});color:var(--b${b}-ink)">${fmtH(h)}</td>`;
        }).join('')}
        <td class="tot">${fmtH(p.total)}h</td></tr>`).join('')}
      </tbody></table></div>`;
}

// 월: 월~금 달력. 날짜를 누르면 그날의 일간 보기로 이동.
function renderMonth(body, entries) {
  const key = monthKey(S.anchor);
  const [from, to] = monthRange(key);
  const byDate = {};
  for (const e of entries) (byDate[e.date] = byDate[e.date] || []).push(e);
  const today = todayStr();
  const MAXCHIPS = 3;
  let cells = '';
  for (let w = weekStart(from); w <= to; w = addDays(w, 7)) {
    const week = [0, 1, 2, 3, 4].map((i) => addDays(w, i));
    if (!week.some((d) => d >= from && d <= to)) continue;
    for (const d of week) {
      if (d < from || d > to) { cells += '<div class="day out" aria-hidden="true"></div>'; continue; }
      const list = (byDate[d] || []).slice().sort((a, b) => hoursOf(b) - hoursOf(a) || a.name.localeCompare(b.name, 'ko'));
      const chips = list.slice(0, MAXCHIPS).map((e) => {
        const b = binOf(hoursOf(e));
        return `<span class="chip" style="background:var(--b${b});color:var(--b${b}-ink)">${esc(shortName(e.name))}</span>`;
      }).join('');
      const more = list.length > MAXCHIPS ? `<span class="more">+${list.length - MAXCHIPS}명</span>` : '';
      const tipText = list.length ? `${shortDate(d)} 결강 ${list.length}명\n` + list.map((e) => `${shortName(e.name)} · ${e.reason} ${fmtH(hoursOf(e))}h`).join('\n') : `${shortDate(d)} 결강 없음`;
      cells += `<button type="button" class="day${d === today ? ' today' : ''}" data-date="${d}" data-tip="${esc(tipText)}" aria-label="${esc(tipText.replace(/\n/g, ', '))}">
        <span class="dn"><span>${parseYmd(d).getDate()}</span>${list.length ? `<span class="cnt">${list.length}명</span>` : ''}</span>${chips}${more}</button>`;
    }
  }
  const monthEntries = entries.length;
  const sum = entries.reduce((a, e) => a + hoursOf(e), 0);
  body.innerHTML = `
    <div class="hint" style="margin-top:12px">${monthEntries ? `결강 ${new Set(entries.map((e) => e.name)).size}명 · 연인원 ${monthEntries}명 · 총 ${fmtH(sum)}시간 · 날짜를 누르면 자세히` : '이 달에는 결강이 없어요'}</div>
    <div class="cal">${['월', '화', '수', '목', '금'].map((x) => `<div class="dow">${x}</div>`).join('')}${cells}</div>`;
}

/* 툴팁: 마우스는 hover, 터치는 탭 */
const tip = $('tip');
function showTip(el, x, y) {
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  const left = Math.min(Math.max(8, x - r.width / 2), innerWidth - r.width - 8);
  let top = y - r.height - 12; if (top < 8) top = y + 16;
  tip.style.left = `${left}px`; tip.style.top = `${top}px`;
}
document.addEventListener('pointerover', (ev) => {
  if (ev.pointerType !== 'mouse') return;
  const el = ev.target.closest('[data-tip]');
  if (el) showTip(el, ev.clientX, ev.clientY); else tip.hidden = true;
});
document.addEventListener('pointermove', (ev) => {
  const el = ev.target.closest('[data-tip]');
  if (ev.pointerType === 'mouse' && !tip.hidden && el) showTip(el, ev.clientX, ev.clientY);
});
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-tip]');
  if (el && !el.dataset.date) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.top); } else tip.hidden = true;
});
addEventListener('scroll', () => { tip.hidden = true; }, { passive: true, capture: true });

/* ================= 이벤트 ================= */
function renderAll() {
  renderForm(); renderMessage(); renderDash(); renderNameList();
}
function renderNameList() {
  const names = new Set();
  Object.values(S.months).forEach((list) => list.forEach((e) => names.add(e.name)));
  $('nameList').innerHTML = [...names].sort((a, b) => a.localeCompare(b, 'ko')).map((n) => `<option value="${esc(n)}">`).join('');
}

$('prevDay').onclick = () => { S.userNavigated = true; setTarget(nextWeekday(S.target, -1)); };
$('nextDay').onclick = () => { S.userNavigated = true; setTarget(nextWeekday(S.target, 1)); };
$('name').addEventListener('change', () => {
  const n = normName($('name').value);
  $('name').value = n;
  prefs.name = n; store.set('kd_prefs', prefs);
  loadFormForTarget();
});
$('reason').onchange = () => {
  S.form.reason = $('reason').value;
  // 휴가류인데 시간이 비어 있으면 08:30~17:30 으로 채움
  if (reasonType(S.form.reason) === 'leave' && !S.form.slots.size) { S.form.slots = timesToSlots('08:30~17:30'); renderBlocks(); }
};
$('presets').onclick = (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  S.form.slots = timesToSlots(b.dataset.p); renderBlocks();
};
$('blocks').onclick = (ev) => {
  const b = ev.target.closest('.blk'); if (!b) return;
  const i = Number(b.dataset.i);
  if (S.form.slots.has(i)) S.form.slots.delete(i); else S.form.slots.add(i);
  renderBlocks();
};
$('addReasonBtn').onclick = () => { $('addReasonForm').hidden = false; $('newReason').focus(); };
$('cancelReason').onclick = () => { $('addReasonForm').hidden = true; $('newReason').value = ''; };
$('reasonTypeSeg').onclick = (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  S.newReasonType = b.dataset.rtype;
  document.querySelectorAll('#reasonTypeSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
};
$('saveReason').onclick = async () => {
  const name = $('newReason').value.trim();
  if (!name) return;
  const r = { name, type: S.newReasonType };
  try {
    await api.addReason(r);
    if (!S.reasons.some((x) => x.name === name)) S.reasons.push(r);
    S.form.reason = name;
    $('addReasonForm').hidden = true; $('newReason').value = '';
    renderReasons(); renderMessage();
    toast('toast', `사유 '${name}' 추가됨`);
  } catch (err) { toast('toast', `추가 실패: ${err.message}`, true); }
};
$('saveBtn').onclick = save;
$('deleteBtn').onclick = removeMine;
$('loginForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const id = $('adminId').value.trim(), pw = $('adminPw').value;
  if (!id || !pw) return;
  $('loginBtn').disabled = true;
  try {
    await api.login(id, pw);
    S.admin = { id, pw }; store.set('kd_admin', S.admin, true);
    $('adminPw').value = '';
    toast('toast', '관리자로 로그인했어요');
    renderAll();
  } catch (err) { toast('toast', err.message, true); }
  finally { $('loginBtn').disabled = false; }
};
$('adminBadge').onclick = () => { S.admin = null; store.del('kd_admin', true); toast('toast', '로그아웃했어요'); renderAll(); };
$('kindSeg').onclick = (ev) => { const b = ev.target.closest('button'); if (!b) return; S.kind = b.dataset.kind; renderMessage(); };
$('copyBtn').onclick = copyMsg;
$('totalBtn').onclick = () => { $('totalEdit').hidden = false; $('totalInput').value = S.total; $('totalInput').focus(); };
$('totalSave').onclick = async () => {
  const n = Number($('totalInput').value);
  if (!(n > 0)) return;
  try { await api.setTotal(n); S.total = n; $('totalEdit').hidden = true; renderAll(); }
  catch (err) { toast('copyToast', `저장 실패: ${err.message}`, true); }
};
$('viewSeg').onclick = async (ev) => {
  const b = ev.target.closest('button'); if (!b) return;
  S.view = b.dataset.view; store.set('kd_view', S.view);
  await ensureMonths(dashMonths()).catch(() => {});
  renderDash();
};
$('dashBody').addEventListener('click', (ev) => {
  const d = ev.target.closest('.day[data-date]');
  if (!d) return;
  S.view = 'day'; S.anchor = d.dataset.date; store.set('kd_view', S.view);
  renderDash();
});
async function movePeriod(dir) {
  if (S.view === 'day') S.anchor = nextWeekday(S.anchor, dir);
  else if (S.view === 'week') S.anchor = addDays(weekStart(S.anchor), dir * 7);
  else { const d = parseYmd(S.anchor); S.anchor = ymd(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
  await ensureMonths(dashMonths()).catch(() => {});
  renderDash();
}
$('prevPeriod').onclick = () => movePeriod(-1);
$('nextPeriod').onclick = () => movePeriod(1);

/* 미리보기용 샘플 데이터 (미리보기 모드에서만) */
$('seedBtn').onclick = async () => {
  const names = ['서정원', '김병준', '홍진표', '손영주', '최창훈', '김주연', '이민수', '박지훈'];
  const samples = [['육아시간', '15:30~17:30'], ['청원휴가', '08:30~17:30'], ['자녀돌봄', '08:00~08:30,13:00~15:00'], ['육아시간', '16:30~17:30'], ['자녀돌봄', '08:30~12:00']];
  const [from] = monthRange(monthKey(S.target));
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const now = new Date().toISOString();
  for (let t = from; t <= addDays(S.target, 5); t = addDays(t, 1)) {
    if (isWeekend(t)) continue;
    await api.upsert({ date: t, name: '소령 서정원', status: 'absent', reason: '육아시간', times: '15:30~17:30', updatedAt: now });
    for (const n of names.slice(1)) {
      const r = rnd();
      if (r < 0.2) { const s = samples[Math.floor(rnd() * samples.length)]; await api.upsert({ date: t, name: `소령 ${n}`, status: 'absent', reason: s[0], times: s[1], updatedAt: now }); }
    }
  }
  await ensureMonths([monthKey(S.target), ...dashMonths()], true);
  loadFormForTarget(); renderAll();
};

/* 정오가 지나면 조사 날짜 자동 변경 */
setInterval(() => {
  if (S.userNavigated) { renderDateNav(); renderLock(); return; }
  const t = defaultTarget();
  if (t !== S.target) setTarget(t);
}, 60 * 1000);

/* ================= 시작 ================= */
(async function init() {
  // ?demo 를 붙이면 서버 대신 이 기기에만 저장 (테스트용)
  if (location.search.includes('demo')) { Object.assign(api, localApi()); }
  $('modeBadge').textContent = api.demo ? '미리보기 · 이 기기에만 저장' : '공유 저장';
  $('demoTools').hidden = !api.demo;
  if (prefs.name) $('name').value = prefs.name;
  renderPresets(); renderLegend();
  renderDateNav(); renderLock();
  try { await ensureMonths([monthKey(S.target), ...dashMonths()]); }
  catch (err) { toast('toast', `불러오기 실패: ${err.message}`, true); }
  loadFormForTarget();
  renderAll();
})();
</script>
